<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#18244a">
<title>E-Scooter Wheelie</title>
<style>
  html, body { margin: 0; height: 100%; background: #101018; overflow: hidden;
               overscroll-behavior: none; }
  canvas { position: fixed; left: 0; top: 0; width: 100%; height: 100%; display: block;
           touch-action: none; -webkit-user-select: none; user-select: none;
           -webkit-tap-highlight-color: transparent; }
  #safe { position: fixed; left: env(safe-area-inset-left, 0px); right: env(safe-area-inset-right, 0px);
          top: 0; height: 0; visibility: hidden; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="safe"></div>
<script src="game.js"></script>
</body>
</html>
